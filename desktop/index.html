<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src http: https:; object-src 'none'; base-uri 'none'">
    <title>Veil Browser</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./renderer.js" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <a class="brand" href="#" id="homeButton" aria-label="Veil home">veil<span>.</span></a>
      <div class="navigation">
        <button class="icon-button" id="backButton" aria-label="Go back" title="Back">←</button>
        <button class="icon-button" id="forwardButton" aria-label="Go forward" title="Forward">→</button>
        <button class="icon-button" id="reloadButton" aria-label="Reload page" title="Reload">↻</button>
      </div>
      <form id="addressForm" class="address-form">
        <span class="address-mark" aria-hidden="true">◇</span>
        <input id="addressInput" type="text" autocomplete="url" spellcheck="false" placeholder="Enter a web address or search" aria-label="Web address or search">
        <button type="submit">Go</button>
      </form>
      <span class="browser-status" id="browserStatus" role="status">Ready</span>
    </header>
    <main class="browser-area">
      <webview
        id="browser"
        src="about:blank"
        partition="persist:veil-browser"
        allowpopups
        title="Web page">
      </webview>
      <section class="welcome" id="welcome">
        <div class="welcome-mark">V</div>
        <p class="eyebrow">YOUR WINDOW TO THE WEB</p>
        <h1>Browse the web directly.</h1>
        <p>Enter a website or search above. Pages run in Chromium with their own normal browser storage and network features.</p>
        <p class="note">This desktop app opens sites directly; it does not route traffic through Veil's hosted proxy.</p>
      </section>
    </main>
  </body>
</html>
